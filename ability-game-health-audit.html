<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mercury Redux — Ability Game Health Audit</title>
<meta name="theme-color" content="#16345d">
<style>
:root{--navy:#16345d;--navy2:#0d2442;--cream:#f5eedc;--paper:#fffdf8;--gold:#d2a23a;--line:#d8ccb0;--text:#17202e;--muted:#667184;--red:#a43b3b;--orange:#a96a17;--yellow:#8a7212;--blue:#2f69a8;--green:#2f7d4b;--shadow:0 8px 24px rgba(17,35,61,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--navy),var(--navy2));color:white;border-bottom:3px solid var(--gold);padding:12px 14px;box-shadow:0 3px 14px rgba(0,0,0,.2)}
.topin{max-width:880px;margin:auto}.title{font-size:18px;font-weight:850}.sub{font-size:12px;opacity:.8;margin-top:2px}.progrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:8px}.prog{height:10px;border-radius:999px;background:#ffffff26;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);width:0}.count{font-size:12px;font-weight:800}
.wrap{max-width:880px;margin:auto;padding:14px 12px 96px}.tools{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:10px}.field{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:11px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.head{padding:14px;background:#eaf0f7;border-bottom:1px solid #ccd6e4}.eyebrow{font-size:12px;text-transform:uppercase;font-weight:850;letter-spacing:.55px;color:var(--blue)}.name{font-size:24px;font-weight:900;line-height:1.1;margin:4px 0}.source{font-size:12px;color:var(--muted)}
.verdict{display:inline-block;margin-top:9px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:850}.red{background:#f7d6d6;color:#812b2b}.orange{background:#f8e2c5;color:#7f4b0a}.yellow{background:#fff3c8;color:#74600b}.blue{background:#dbeafd;color:#245a94}
.body{padding:13px}.box{border:1px solid #e0d8c6;border-radius:13px;background:white;padding:12px;margin-bottom:10px}.lab{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:850;color:#647084;margin-bottom:5px}.txt{line-height:1.45}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action{min-height:48px;border:1px solid #bac5d4;background:#fff;border-radius:12px;font-weight:780;padding:8px;color:#223653}.action.active{outline:3px solid rgba(47,105,168,.18);border-color:var(--blue);background:#edf5ff}.action[data-action="keep"].active{border-color:var(--green);background:#edf8f0;color:#1f6138}.action[data-action="exclude"].active{border-color:var(--red);background:#fff0f0;color:#7f2929}.action[data-action="redesign"].active,.action[data-action="verify"].active{border-color:var(--orange);background:#fff6e7;color:#7d4d0b}.action[data-action="keep-limits"].active{border-color:var(--yellow);background:#fff9df;color:#6e5d11}
textarea{min-height:92px;resize:vertical}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.nav button,.minor{border:1px solid #b8c5d7;background:white;border-radius:12px;padding:11px;font-weight:780;color:var(--navy)}.nav .primary{background:var(--navy);color:white;border-color:var(--navy)}.footerTools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
@media(min-width:700px){.actions{grid-template-columns:repeat(3,1fr)}.footerTools{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header class="top"><div class="topin"><div class="title">Mercury Redux — Ability Game Health Audit</div><div class="sub">Power is allowed. Flag unpredictability, lost control, unstable counterplay, loops, and dangerous stacking.</div><div class="progrow"><div class="prog"><i id="bar"></i></div><div class="count" id="count">0 / 11</div></div></div></header>
<main class="wrap">
<div class="tools"><input id="search" class="field" placeholder="Search flagged abilities…"><select id="filter" class="field"><option value="pending">Pending first</option><option value="all">All</option><option value="red">Red only</option><option value="verify">Verify/watch</option><option value="reviewed">Reviewed</option></select></div>
<div id="mount"></div>
<div class="footerTools"><button class="minor" id="nextPending">Next pending</button><button class="minor" id="exportBtn">Export approvals</button><button class="minor" id="importBtn">Import approvals</button><button class="minor" id="copyBtn">Copy summary</button><input id="importFile" type="file" accept="application/json" hidden></div>
<div class="status">Your choices save automatically in this browser. Export them when you finish so they can be applied to the canonical Mercury library.</div>
</main>
<script>
const ABILITIES=[{"id":1,"name":"PRISMATIC FUR","source":"Elite Redux","effect":"Color Change + Protean + Fur Coat + Ice Scales","verdict":"RED — Problematic","reason":"Both attacking and being hit continually rewrite its typing while Fur Coat and Ice Scales heavily blunt both damage categories. Even with full knowledge, the opponent lacks a stable matchup plan.","recommendation":"Redesign before use; do not place in the normal pool unchanged.","confidence":"Exact source comment","defaultAction":"redesign"},{"id":2,"name":"Stop \\\\PN","source":"Pokémon Rejuvenation","effect":"One version progressively disables a newly entered foe's ability, then typing, then moves; raid-shield events can also alter the state.","verdict":"RED — Not normal-pool suitable","reason":"It progressively deletes the opponent's battle rules and options rather than asking the player to solve a stable mechanic.","recommendation":"Keep only as source/reference for a bespoke raid/boss system; exclude from the normal ability pool.","confidence":"Verified wiki mechanics","defaultAction":"exclude"},{"id":3,"name":"Storm-9","source":"Pokémon Rejuvenation","effect":"Summons a random weather on entry and changes to another random weather every turn; also has weather-related extras.","verdict":"RED — Problematic","reason":"The field rules can change unpredictably every turn, so weather-dependent planning can become invalid through no player decision.","recommendation":"Redesign to a deterministic weather cycle/choice or exclude unchanged.","confidence":"Verified wiki mechanics","defaultAction":"redesign"},{"id":4,"name":"Commissioner","source":"Radical Red Showdown mod (CAP/test entry)","effect":"At end of turn randomly gains +1 Speed, Torments a foe, gains +1 Defense, forces a foe out, or gains Aqua Ring.","verdict":"RED — Problematic","reason":"The outcomes are materially different battle states, including forced switching, and the opponent cannot know which rule will apply next.","recommendation":"Exclude from the normal pool unchanged; only revisit as a redesigned gimmick.","confidence":"Exact Showdown implementation description","defaultAction":"exclude"},{"id":5,"name":"Berserk Fury","source":"Pokémon Exceeded","effect":"Ups Attack, use random move.","verdict":"ORANGE — Verify / likely problem","reason":"If it literally forces random move selection, it removes player control rather than creating strategic uncertainty.","recommendation":"Verify implementation. If forced random selection is confirmed, redesign or exclude.","confidence":"Terse in-game summary","defaultAction":"verify"},{"id":6,"name":"Eternal Life","source":"Pokémon Exceeded","effect":"Revives after 15 turns.","verdict":"ORANGE — Verify","reason":"A 15-turn revival is predictable; the concern is whether it can repeat indefinitely and create a stall/revival loop.","recommendation":"Verify one-time versus repeatable behavior. Keep if bounded; redesign if repeatable.","confidence":"Terse in-game summary","defaultAction":"verify"},{"id":7,"name":"Hollow Shell","source":"Pokémon Exceeded","effect":"Faints the attacker when KOed.","verdict":"YELLOW — Watch","reason":"The effect is harsh but deterministic, so it can be planned around. The concern is forced one-for-one trades and abusive revival/sacrifice combinations.","recommendation":"Keep provisionally; verify exact trigger and review only dangerous pairings/distribution.","confidence":"Terse in-game summary","defaultAction":"keep-limits"},{"id":8,"name":"Mind Game","source":"Pokémon Exceeded","effect":"Prevents move usage.","verdict":"ORANGE — Verify","reason":"The summary is too vague. A narrow deterministic restriction could be fine; broad automatic move denial could erase meaningful choices.","recommendation":"Verify trigger, target, duration, and exactly what is prevented before deciding.","confidence":"Terse in-game summary","defaultAction":"verify"},{"id":9,"name":"Protean Maxima","source":"Pokémon Insurgence","effect":"At the start of the turn, Mega Eevee changes into the Eeveelution matching the selected move's type, gaining that form's typing, stats, and ability.","verdict":"YELLOW — Watch","reason":"It changes typing, stats, and ability from a hidden move choice before actions resolve. It is deterministic, but opponents may not have a stable same-turn answer.","recommendation":"Keep only as a species-specific mechanic with very clear transformation feedback; do not distribute broadly.","confidence":"Verified wiki mechanics","defaultAction":"keep-limits"},{"id":10,"name":"The Look","source":"Radical Red Showdown mod (CAP/test entry)","effect":"Opposing Pokémon cannot use the same move twice in a row while the user is active.","verdict":"BLUE — Plan-able","reason":"It restricts options, but the restriction is fixed, visible, and predictable once known.","recommendation":"Mechanically acceptable; keep source-status warning because it is a CAP/test entry.","confidence":"Exact Showdown implementation description","defaultAction":"keep"},{"id":11,"name":"Bioengineering","source":"Pokémon Exceeded","effect":"Change form in battle.","verdict":"ORANGE — Verify","reason":"The form-change rule is not described well enough to know whether the opponent can predict or understand it.","recommendation":"Verify exact trigger, available forms, timing, and stat/type/ability changes before deciding.","confidence":"Terse in-game summary","defaultAction":"verify"}];
const DEFAULTS=Object.fromEntries(ABILITIES.map(a=>[a.id,{action:a.defaultAction,notes:"",custom:""}]));
const STORE="mercury-ability-health-audit-v1";
const state={index:0,search:"",filter:"pending",approvals:load()};
function load(){try{const s=localStorage.getItem(STORE);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULTS))}catch{return JSON.parse(JSON.stringify(DEFAULTS))}}
function save(){localStorage.setItem(STORE,JSON.stringify(state.approvals));progress()}
function aFor(x){return state.approvals[x.id]||{action:"pending",notes:"",custom:""}}
function done(x){return aFor(x).action&&aFor(x).action!=="pending"}
function list(){let a=ABILITIES.filter(x=>{const q=state.search.trim().toLowerCase();if(q&&!([x.name,x.source,x.effect,x.reason].join(" ").toLowerCase().includes(q)))return false;if(state.filter==="red"&&!x.verdict.startsWith("RED"))return false;if(state.filter==="verify"&&!(x.verdict.startsWith("ORANGE")||x.verdict.startsWith("YELLOW")))return false;if(state.filter==="reviewed"&&!done(x))return false;return true});if(state.filter==="pending")a.sort((x,y)=>(done(x)?1:0)-(done(y)?1:0)||x.id-y.id);return a}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cls(v){return v.startsWith("RED")?"red":v.startsWith("ORANGE")?"orange":v.startsWith("YELLOW")?"yellow":"blue"}
function label(k){return({keep:"Keep unchanged","keep-limits":"Keep with limits","verify":"Verify mechanics","redesign":"Redesign","exclude":"Exclude","pending":"Pending"})[k]||k}
function current(){const a=list();if(!a.length)return null;state.index=Math.max(0,Math.min(state.index,a.length-1));return a[state.index]}
function render(){const arr=list(),x=current(),m=document.getElementById("mount");if(!x){m.innerHTML='<div class="box">No abilities match this view.</div>';progress();return}const a=aFor(x);m.innerHTML='<section class="card"><div class="head"><div class="eyebrow">Flagged ability '+x.id+' of '+ABILITIES.length+'</div><div class="name">'+esc(x.name)+'</div><div class="source">'+esc(x.source)+'</div><div class="verdict '+cls(x.verdict)+'">'+esc(x.verdict)+'</div></div><div class="body"><div class="box"><div class="lab">Effect</div><div class="txt">'+esc(x.effect)+'</div></div><div class="box"><div class="lab">Why it was flagged</div><div class="txt">'+esc(x.reason)+'</div></div><div class="box"><div class="lab">Current recommendation</div><div class="txt">'+esc(x.recommendation)+'</div></div><div class="box"><div class="lab">Your decision</div><div class="actions">'+[["keep","Keep"],["keep-limits","Keep w/ limits"],["verify","Verify"],["redesign","Redesign"],["exclude","Exclude"],["pending","Undecided"]].map(([k,l])=>'<button class="action '+(a.action===k?"active":"")+'" data-action="'+k+'">'+l+'</button>').join("")+'</div><div class="lab" style="margin-top:12px">Custom replacement / restriction</div><textarea id="custom" class="field" placeholder="Optional: type the replacement effect, restriction, or implementation rule…">'+esc(a.custom||"")+'</textarea><div class="lab" style="margin-top:10px">Notes</div><textarea id="notes" class="field" placeholder="Optional notes…">'+esc(a.notes||"")+'</textarea></div><div class="nav"><button id="prev">← Previous</button><button class="primary" id="next">Next →</button></div><div class="status">'+(state.index+1)+' of '+arr.length+' in this view • '+esc(label(a.action))+'</div></div></section>';wire(x,a);progress()}
function wire(x,a){document.querySelectorAll(".action").forEach(b=>b.onclick=()=>{a.action=b.dataset.action;state.approvals[x.id]=a;save();render()});document.getElementById("custom").oninput=e=>{a.custom=e.target.value;state.approvals[x.id]=a;save()};document.getElementById("notes").oninput=e=>{a.notes=e.target.value;state.approvals[x.id]=a;save()};document.getElementById("prev").onclick=()=>{state.index=Math.max(0,state.index-1);render();scrollTo(0,0)};document.getElementById("next").onclick=()=>{state.index=Math.min(list().length-1,state.index+1);render();scrollTo(0,0)}}
function progress(){const n=ABILITIES.filter(done).length;document.getElementById("count").textContent=n+" / "+ABILITIES.length;document.getElementById("bar").style.width=(100*n/ABILITIES.length)+"%"}
function gotoPending(){const a=list();if(!a.length)return;for(let s=1;s<=a.length;s++){const i=(state.index+s)%a.length;if(!done(a[i])){state.index=i;render();scrollTo(0,0);return}}}
document.getElementById("search").oninput=e=>{state.search=e.target.value;state.index=0;render()};
document.getElementById("filter").onchange=e=>{state.filter=e.target.value;state.index=0;render()};
document.getElementById("nextPending").onclick=gotoPending;
document.getElementById("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({project:"Pokemon Mercury Redux",kind:"ability-game-health-approval",version:1,exportedAt:new Date().toISOString(),abilities:ABILITIES,approvals:state.approvals},null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="mercury-ability-game-health-approvals.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);state.approvals=j.approvals||j;save();render();alert("Approvals imported.")}catch{alert("Invalid approval JSON.")}};r.readAsText(f)};
document.getElementById("copyBtn").onclick=async()=>{const lines=ABILITIES.map(x=>{const a=aFor(x);return x.name+": "+label(a.action)+(a.custom?" | "+a.custom:"")+(a.notes?" | "+a.notes:"")});try{await navigator.clipboard.writeText(lines.join("\n"));alert("Summary copied.")}catch{alert("Clipboard was blocked.")}};
render();
</script></body></html>
