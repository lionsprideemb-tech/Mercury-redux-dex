<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mercury Redux — Ability Game Health Approval</title><meta name="theme-color" content="#16345d">
<style>
:root{--navy:#16345d;--cream:#f7f0dc;--paper:#fffdf7;--line:#d7ccb2;--text:#182131;--muted:#687386;--red:#a53b3b;--orange:#a96d16;--yellow:#8b7514;--blue:#316aa6}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:12px;border-bottom:3px solid #d6a63d}.top{max-width:820px;margin:auto}.title{font-size:18px;font-weight:800}.small{font-size:12px;opacity:.8;margin-top:3px}.bar{margin-top:9px;height:8px;background:#ffffff2b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#d6a63d;width:0}.count{font-size:12px;font-weight:700;margin-top:5px}
main{max-width:820px;margin:auto;padding:12px 12px 84px}.controls{display:grid;grid-template-columns:1fr 160px;gap:8px;margin-bottom:10px}.controls input,.controls select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 7px 22px #1a2b4014}.head{padding:14px;background:#edf1f7}.tier{font-size:12px;font-weight:900;letter-spacing:.7px}.tier.RED{color:var(--red)}.tier.ORANGE{color:var(--orange)}.tier.YELLOW{color:var(--yellow)}.tier.BLUE{color:var(--blue)}h2{margin:4px 0 2px;font-size:22px}.source{font-size:12px;color:var(--muted)}
.body{padding:13px}.label{font-size:12px;font-weight:850;color:#4f5b6a;margin-top:10px}.text{line-height:1.45;margin-top:4px}.rec{padding:10px;border-radius:10px;background:#f1f4f8;margin-top:6px;font-weight:750}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.actions button{padding:11px 8px;border-radius:11px;border:1px solid #bdc7d3;background:#fff;font-weight:750}.actions button.active{outline:3px solid #316aa633;border-color:#316aa6;background:#eef6ff}
textarea{width:100%;min-height:76px;margin-top:6px;border:1px solid #c8cfd9;border-radius:10px;padding:9px;resize:vertical}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.nav button,.tools button{padding:11px;border-radius:11px;border:1px solid #b9c5d5;background:white;font-weight:750}.nav .next{background:var(--navy);color:white}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
@media(max-width:560px){.controls{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
</style></head>
<body><header><div class="top"><div class="title">Mercury Redux — Ability Game Health</div><div class="small">Prismatic Fur standard: powerful is fine; unplannable is the problem.</div><div class="bar"><i id="bar"></i></div><div class="count" id="count"></div></div></header>
<main><div class="controls"><input id="search" placeholder="Search candidates…"><select id="filter"><option value="all">All 11</option><option value="pending">Pending only</option><option value="RED">Red</option><option value="ORANGE">Verify</option><option value="YELLOW">Watch</option><option value="BLUE">Cleared</option></select></div><div id="mount"></div><div class="tools"><button id="export">Export decisions</button><button id="copy">Copy summary</button></div></main>
<script>
const C=[{"id":1,"name":"PRISMATIC FUR","source":"Elite Redux","effect":"Color Change + Protean + Fur Coat + Ice Scales","recommendation":"Redesign","tier":"RED","reason":"Both attacking and being hit continually rewrite typing while Fur Coat and Ice Scales blunt both damage categories. Even with full knowledge, the opponent lacks a stable matchup plan.","confidence":"Exact source comment"},{"id":2,"name":"Stop \\\\PN","source":"Pokémon Rejuvenation","effect":"One version progressively disables a newly entered foe's ability, then typing, then moves; raid-shield events can also alter the state.","recommendation":"Boss/raid only","tier":"RED","reason":"It progressively deletes the opponent's battle rules and options rather than asking the player to solve a stable mechanic.","confidence":"Verified wiki mechanics"},{"id":3,"name":"Storm-9","source":"Pokémon Rejuvenation","effect":"Summons a random weather on entry and changes to another random weather every turn; also has weather-related extras.","recommendation":"Redesign","tier":"RED","reason":"The field rules can change unpredictably every turn, invalidating weather-dependent planning without a player decision.","confidence":"Verified wiki mechanics"},{"id":4,"name":"Commissioner","source":"Radical Red Showdown mod (CAP/test entry)","effect":"At end of turn randomly gains +1 Speed, Torments a foe, gains +1 Defense, forces a foe out, or gains Aqua Ring.","recommendation":"Exclude unchanged","tier":"RED","reason":"The outcomes are materially different battle states, including forced switching, and cannot be planned around reliably.","confidence":"Exact Showdown implementation description"},{"id":5,"name":"Berserk Fury","source":"Pokémon Exceeded","effect":"Ups Attack, use random move.","recommendation":"Verify first","tier":"ORANGE","reason":"If it literally forces random move selection, it removes player control rather than creating strategic uncertainty.","confidence":"Terse in-game summary"},{"id":6,"name":"Eternal Life","source":"Pokémon Exceeded","effect":"Revives after 15 turns.","recommendation":"Verify first","tier":"ORANGE","reason":"A 15-turn revival is predictable; the concern is only whether it can repeat indefinitely and create a stall/revival loop.","confidence":"Terse in-game summary"},{"id":7,"name":"Hollow Shell","source":"Pokémon Exceeded","effect":"Faints the attacker when KOed.","recommendation":"Keep / watch","tier":"YELLOW","reason":"Harsh but deterministic. The concern is forced one-for-one trades and revival/sacrifice combinations, not unpredictability.","confidence":"Terse in-game summary"},{"id":8,"name":"Mind Game","source":"Pokémon Exceeded","effect":"Prevents move usage.","recommendation":"Verify first","tier":"ORANGE","reason":"The summary is too vague to know whether it is a narrow deterministic restriction or broad automatic move denial.","confidence":"Terse in-game summary"},{"id":9,"name":"Protean Maxima","source":"Pokémon Insurgence","effect":"At the start of the turn, Mega Eevee changes into the Eeveelution matching the selected move's type, gaining that form's typing, stats, and ability.","recommendation":"Species-specific / watch","tier":"YELLOW","reason":"It is deterministic, but a hidden move choice rewrites typing, stats, and ability before actions resolve. Clear visual feedback and narrow distribution are essential.","confidence":"Verified wiki mechanics"},{"id":10,"name":"The Look","source":"Radical Red Showdown mod (CAP/test entry)","effect":"Opposing Pokémon cannot use the same move twice in a row while the user is active.","recommendation":"Keep","tier":"BLUE","reason":"The restriction is fixed, visible, and predictable once known.","confidence":"Exact Showdown implementation description"},{"id":11,"name":"Bioengineering","source":"Pokémon Exceeded","effect":"Change form in battle.","recommendation":"Verify first","tier":"ORANGE","reason":"The form-change rule is not described well enough to judge whether the opponent can predict or understand it.","confidence":"Terse in-game summary"}],KEY="mercury-ability-health-v1";let S={i:0,q:"",f:"all",d:load()};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}function save(){localStorage.setItem(KEY,JSON.stringify(S.d));progress()}
function decision(c){return S.d[c.id]||{choice:"Pending",notes:""}}function done(c){return decision(c).choice!=="Pending"}
function list(){let a=C.filter(c=>{if(S.f==="pending"&&done(c))return false;if(["RED","ORANGE","YELLOW","BLUE"].includes(S.f)&&c.tier!==S.f)return false;const q=S.q.trim().toLowerCase();return !q||[c.name,c.source,c.effect,c.reason].join(" ").toLowerCase().includes(q)});return a}
function esc(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function progress(){const n=C.filter(done).length;document.getElementById("count").textContent=n+" / "+C.length+" reviewed";document.getElementById("bar").style.width=(n/C.length*100)+"%"}
function render(){const a=list();if(!a.length){mount.innerHTML='<div class="card"><div class="body">No candidates match this view.</div></div>';progress();return}S.i=Math.max(0,Math.min(S.i,a.length-1));const c=a[S.i],d=decision(c);mount.innerHTML='<article class="card"><div class="head"><div class="tier '+c.tier+'">'+c.tier+'</div><h2>'+esc(c.name)+'</h2><div class="source">'+esc(c.source)+' • '+esc(c.confidence)+'</div></div><div class="body"><div class="label">Effect</div><div class="text">'+esc(c.effect)+'</div><div class="label">Why it was flagged</div><div class="text">'+esc(c.reason)+'</div><div class="label">Current recommendation</div><div class="rec">'+esc(c.recommendation)+'</div><div class="label">Your decision</div><div class="actions">'+["Keep","Keep / watch","Verify first","Redesign","Boss/raid only","Remove"].map(x=>'<button data-v="'+esc(x)+'" class="'+(d.choice===x?"active":"")+'">'+esc(x)+'</button>').join("")+'</div><div class="label">Notes</div><textarea id="notes" placeholder="Optional…">'+esc(d.notes)+'</textarea></div></article><div class="nav"><button id="prev">← Previous</button><button class="next" id="next">Next →</button></div><div class="status">'+(S.i+1)+' of '+a.length+' in this view</div>';document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{d.choice=b.dataset.v;S.d[c.id]=d;save();render()});notes.oninput=()=>{d.notes=notes.value;S.d[c.id]=d;save()};prev.onclick=()=>{S.i=Math.max(0,S.i-1);render();scrollTo(0,0)};next.onclick=()=>{S.i=Math.min(a.length-1,S.i+1);render();scrollTo(0,0)};progress()}
search.oninput=e=>{S.q=e.target.value;S.i=0;render()};filter.onchange=e=>{S.f=e.target.value;S.i=0;render()};
export.onclick=()=>{const p={project:"Pokemon Mercury Redux",kind:"ability-game-health-decisions",version:1,decisions:S.d};const b=new Blob([JSON.stringify(p,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="mercury-ability-game-health-decisions.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
copy.onclick=async()=>{const t=C.filter(done).map(c=>c.name+": "+decision(c).choice+(decision(c).notes?" — "+decision(c).notes:"")).join("\n");try{await navigator.clipboard.writeText(t);alert("Summary copied.")}catch{alert("Clipboard blocked.")}};
render();
</script></body></html>
