name: Materialize R7 open 118

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-r7-open-118.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full recovered 118 records
        shell: python
        run: |
          import base64,gzip,json
          from pathlib import Path
          root=Path('.')
          idx=json.loads((root/'data/pokedex/index.json').read_text())
          def load(path):
              raw=base64.b64decode(Path(path).read_text().strip())
              if raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
              return json.loads(raw)
          rows=[]
          for n in idx['shards']:
              rows += load(root/'data/pokedex'/n).get('pokemon',[])
          base_by_key={p.get('key'):p for p in rows if p.get('key')}
          base_by_const={p.get('constant'):p for p in rows if p.get('constant')}
          base_by_name={p.get('displayName') or p.get('name'):p for p in rows}
          r7=load(root/'data/pokedex/review_overlay_r7.json.gz.b64')
          defs=r7.get('abilityDefinitions',{})
          ability_by_name={}
          for p in rows:
              for g in ('primaryAbilities','innates','sourceAbilities'):
                  for a in p.get(g) or []:
                      if isinstance(a,dict) and a.get('name'): ability_by_name[a['name']]=a
          for name,a in defs.items():
              if isinstance(a,dict): ability_by_name[name]=a
          def ability(name):
              return json.loads(json.dumps(ability_by_name.get(name) or {'name':name}))
          def find_base(ref):
              return base_by_key.get(ref) or base_by_const.get(ref) or base_by_name.get(ref)
          out=[]
          wanted={x.get('key') for x in r7.get('patches',[])+r7.get('additions',[])}
          # Current open set after source overlays
          current=[dict(p) for p in rows]
          bykey={p.get('key'):p for p in current if p.get('key')}
          for oname in idx.get('overlays',[]):
              ov=load(root/'data/pokedex'/oname)
              for item in ov.get('patches',[]):
                  p=bykey.get(item.get('key'))
                  if p is not None: p.update(item.get('set') or {})
              for item in ov.get('additions',[]):
                  k=item.get('key')
                  if not k or k in bykey: continue
                  p=dict(item); p.update(item.get('set') or {}); p.pop('set',None)
                  current.append(p);bykey[k]=p
              rem=set(ov.get('removeKeys',[]));current=[p for p in current if p.get('key') not in rem];bykey={p.get('key'):p for p in current if p.get('key')}
          openkeys={p.get('key') for p in current if p.get('integrationState')=='APPROVED_DESIGN_RECORD'}
          items={x['key']:x for x in r7.get('patches',[])+r7.get('additions',[]) if x.get('key') in openkeys}
          for key in sorted(openkeys):
              item=items[key]
              cur=bykey[key]
              base=find_base(item.get('inheritFrom')) if item.get('inheritFrom') else None
              p=json.loads(json.dumps(cur))
              if base:
                  forced=set(item.get('forceInherit') or [])
                  for f in ('stats','bst','description','levelUpMoves','sourceAbilities'):
                      val=p.get(f)
                      blank=val is None or val==[] or val=={} or val==''
                      if f in forced or blank: p[f]=json.loads(json.dumps(base.get(f)))
                  # Useful art fallback metadata; do not claim exact approved master.
                  if not p.get('spriteAtlas') and base.get('spriteAtlas'):
                      p['baseSpriteFallback']=json.loads(json.dumps(base.get('spriteAtlas')))
              s=json.loads(json.dumps(item.get('set') or {}))
              prim=s.pop('primaryAbilityNames',None); inn=s.pop('innateNames',None)
              p.update(s)
              if prim is not None: p['primaryAbilities']=[ability(x) for x in prim]
              if inn is not None: p['innates']=[ability(x) for x in inn]
              if item.get('extraMoves'):
                  moves=json.loads(json.dumps(p.get('levelUpMoves') or []));seen={(m.get('level'),m.get('move')) for m in moves}
                  for m in item['extraMoves']:
                      sig=(m.get('level'),m.get('move'))
                      if sig not in seen: moves.append(json.loads(json.dumps(m)));seen.add(sig)
                  def lv(m):
                      try:return int(m.get('level'))
                      except:return 999
                  moves.sort(key=lambda m:(lv(m),str(m.get('move'))))
                  p['levelUpMoves']=moves
              p['recoverySource']='R7 review overlay + inherited source-bound base species'
              out.append(p)
          assert len(out)==118, len(out)
          Path('materialized_open_118.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          summary={
            'count':len(out),
            'types':sum(bool(p.get('types')) for p in out),
            'stats':sum(bool(p.get('stats')) and all((p.get('stats') or {}).get(k) is not None for k in ('hp','atk','def','spa','spd','spe')) for p in out),
            'primary':sum(bool(p.get('primaryAbilities')) for p in out),
            'innates':sum(bool(p.get('innates')) for p in out),
            'moves':sum(bool(p.get('levelUpMoves')) for p in out),
            'exactSprite':sum(bool(p.get('spriteAtlas')) for p in out),
            'baseSpriteFallback':sum(bool(p.get('baseSpriteFallback')) for p in out),
          }
          print(json.dumps(summary,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: mercury-materialized-open-118
          path: materialized_open_118.json
