name: Activate open118 R8 sprites

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/activate-open118-r8-sprites.yml'

permissions:
  contents: write

concurrency:
  group: activate-open118-r8-sprites
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate atlas
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path

          root = Path('.')
          d = root / 'assets/atlas_strips/.open118_r8_parts'
          def text(name):
              p = d / name
              assert p.exists(), str(p)
              return p.read_text().strip()
          def check(name,size,want):
              s=text(name)
              assert len(s)==size,(name,len(s),size)
              got=hashlib.sha256(s.encode()).hexdigest()
              assert got==want,(name,got,want)
              return s

          logical = [text(f'part{i:02d}') for i in range(5)]
          logical.append(text('part05_correct'))

          p6a=check('part06a',3000,'34e0b60de1e58ddfc48eda5f57799156a5fd2f0919552708c4470ea474a28e5f')
          p6b=check('part06b',3000,'a4d00e724f6a6f9d299bea17fbf130984115c128bff24d19eeeacf35d3ea8037')
          cparts=[
              check('part06c0',750,'768fc584bfc6022789a21c291474ec70b2f9defe7c09d568310c80a315020e43'),
              check('part06c1',750,'b0a25ae45cd621b51e98b6e5eba59444afc1b3a600178686bfc587bb10fd1fed'),
              check('part06c2',750,'b5a89db9edd2a5f56baf40da68d485b224b0917f9eb9db52246668dcf2cd9b51'),
              check('part06c3',750,'a774bfdd249018cba76040d162ebde8a5b729fdbf9597891aba30857a475de57'),
          ]
          p6c=''.join(cparts)
          assert hashlib.sha256(p6c.encode()).hexdigest()=='991145524e035876a154f3ab4bd9bd95a406cf93a7185535ec12a520aaa035b4'
          p6d=check('part06d',3000,'4e4da8cc7f49e77c5ca9fc303d1433c47b5404f159ea592b638af4a98a1e70b1')
          p6e=check('part06e',2500,'2238b6e1df479ddeb38c1d3e2b2a4454e1484e2831b86d2c8a9d89255f184961')
          logical.append(p6a+p6b+p6c+p6d+p6e)
          logical.append(text('part07'))

          sizes = [len(x) for x in logical]
          assert sizes == [14500,14500,14500,14500,14500,14500,14500,14472], sizes
          expected_chunk_hashes = [
              'df6e2bf183a0b577e4580d114596a9737f155d4d7b9d5ba81bcfeaa6b4f7c262',
              'a9c00ee598ae050f657294b7ce16bea03fa0fd4960268c21ef11616bccfb1cad',
              '263150214483920dd79a59df55a928f702d7fbfb52d62d64335d3e8280e3303d',
              '4c5f19ea5718fd8c461bc14c685399c7f3b40a83de5a21e5eb8c8da8ce05d840',
              '785b6c938065ec17afb6d85e0c5294b594a27bb8909b533e704c6ef4ae8d9be5',
              '6e336bc7b2a1d83923dfd9dae1355e80931f6524537d7d9c127c13f73c59ea72',
              'ecabce485d46f7c228c0c18c05d784a2f14754f14a4592be3dfa2661ff74438c',
              'a46d24a448df18296d8c69c7c5a8f12c72caaa428889364da7e31906d303e3e5',
          ]
          for i,(chunk,want) in enumerate(zip(logical,expected_chunk_hashes)):
              got=hashlib.sha256(chunk.encode()).hexdigest()
              assert got == want, (i,got,want)

          encoded = ''.join(logical)
          assert len(encoded) == 115972, len(encoded)
          raw = base64.b64decode(encoded, validate=True)
          assert len(raw) == 86978, len(raw)
          sha = hashlib.sha256(raw).hexdigest()
          expected = 'c52e4bffb9e6696758f6c253e83816593d7052bcbee6f6001046b16b4b03c291'
          assert sha == expected, (sha, expected)
          (root / 'assets/atlas_strips/open118_r8.webp').write_bytes(raw)

          ov_path = root / 'data/pokedex/sprite_completion_r8.json.gz.b64'
          ov_raw = base64.b64decode(ov_path.read_text().strip())
          if ov_raw[:2] == b'\x1f\x8b': ov_raw = gzip.decompress(ov_raw)
          ov = json.loads(ov_raw)
          patches = ov.get('patches', [])
          assert len(patches) == 118, len(patches)
          exact = [p for p in patches if (p.get('set') or {}).get('spriteAtlas')]
          pending = [p for p in patches if not (p.get('set') or {}).get('spriteAtlas')]
          assert len(exact) == 112, len(exact)
          assert len(pending) == 6, len(pending)
          for p in exact:
              sa = p['set']['spriteAtlas']
              assert sa.get('sheet') == 'assets/atlas_strips/open118_r8.webp', (p.get('key'), sa)
              assert sa.get('w') == 64 and sa.get('h') == 64, (p.get('key'), sa)
          expected_pending = {'PS0001','PS0002','R0628','R0631','R0633','R0652'}
          assert {p.get('key') for p in pending} == expected_pending

          idx_path = root / 'data/pokedex/index.json'
          idx = json.loads(idx_path.read_text())
          overlays = [x for x in idx.get('overlays', []) if x != 'design_completion_118.json.gz.b64']
          if 'completion_overlay_r8.json.gz.b64' not in overlays: overlays.append('completion_overlay_r8.json.gz.b64')
          overlays = [x for x in overlays if x != 'sprite_completion_r8.json.gz.b64']
          overlays.append('sprite_completion_r8.json.gz.b64')
          idx['overlays'] = overlays

          meta = idx.setdefault('meta', {})
          meta['version'] = 'Source-linked R8 — 118 design complete / 112 sprites bound'
          meta['spriteIdentityResolvedForOpenRecords'] = 118
          meta['spriteAtlasBoundForOpenRecords'] = 112
          meta['spriteAtlasPendingForOpenRecords'] = 6
          meta['historicalSpriteMasterRecoveryPending'] = 6
          meta['open118SpriteAtlas'] = 'assets/atlas_strips/open118_r8.webp'
          meta['open118SpriteAtlasSha256'] = expected
          if isinstance(meta.get('spriteCount'), int): meta['spriteCount'] = 1429
          idx_path.write_text(json.dumps(idx, separators=(',',':'), ensure_ascii=False))

          (root / 'R8_118_SPRITE_ACTIVATION_CHECKPOINT.md').write_text(f'''# Pokémon Mercury Redux — R8 open-118 sprite activation\n\nDate: 2026-09-15\n\n- Mechanics authority: `completion_overlay_r8.json.gz.b64`\n- Exact/current-source sprite bindings activated: **112 / 118**\n- Locked historical master recovery pending: **6 / 118**\n- Atlas: `assets/atlas_strips/open118_r8.webp`\n- Atlas bytes: **{len(raw)}**\n- Atlas SHA-256: `{sha}`\n- Sprite overlay: `data/pokedex/sprite_completion_r8.json.gz.b64`\n- The duplicate `design_completion_118.json.gz.b64` was removed from the active overlay order, but retained in-repo as a recovery/audit artifact.\n- No base-species art was substituted for the six missing locked masters.\n''')
          print('atlas sha', sha)
          print('exact bindings', len(exact), 'pending masters', len(pending))
          print('active overlays', idx['overlays'])

      - name: Commit activated atlas and load order
        shell: bash
        run: |
          git config user.name 'Mercury Redux NextDex Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/atlas_strips/open118_r8.webp data/pokedex/index.json R8_118_SPRITE_ACTIVATION_CHECKPOINT.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Activate 112 open118 R8 sprite bindings'
            git push
          fi
