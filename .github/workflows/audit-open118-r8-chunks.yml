name: Audit open118 R8 atlas chunks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-open118-r8-chunks.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare staged chunks to validated artifact hashes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          root=Path('assets/atlas_strips/.open118_r8_parts')
          names=['part00','part01','part02','part03','part04','part05_correct','part06','part07']
          expected=[
            'df6e2bf183a0b577e4580d114596a9737f155d4d7b9d5ba81bcfeaa6b4f7c262',
            'a9c00ee598ae050f657294b7ce16bea03fa0fd4960268c21ef11616bccfb1cad',
            '263150214483920dd79a59df55a928f702d7fbfb52d62d64335d3e8280e3303d',
            '4c5f19ea5718fd8c461bc14c685399c7f3b40a83de5a21e5eb8c8da8ce05d840',
            '785b6c938065ec17afb6d85e0c5294b594a27bb8909b533e704c6ef4ae8d9be5',
            '6e336bc7b2a1d83923dfd9dae1355e80931f6524537d7d9c127c13f73c59ea72',
            'ecabce485d46f7c228c0c18c05d784a2f14754f14a4592be3dfa2661ff74438c',
            'a46d24a448df18296d8c69c7c5a8f12c72caaa428889364da7e31906d303e3e5',
          ]
          bad=[]
          for name,want in zip(names,expected):
            p=root/name
            data=p.read_bytes()
            got=hashlib.sha256(data).hexdigest()
            ok=got==want
            print(name,'bytes',len(data),'OK' if ok else 'BAD','got',got,'expected',want)
            if not ok: bad.append(name)
          print('BAD CHUNKS',bad)
          if bad: raise SystemExit(1)
