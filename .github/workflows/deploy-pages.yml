name: Deploy Mercury Dex to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'app.js'
      - 'styles.css'
      - '.nojekyll'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required Mercury Dex payload
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f data/pokedex.json.gz
          test -d assets/atlas
          COUNT=$(find assets/atlas -type f -name 'sprites_*.png' | wc -l)
          if [ "$COUNT" -lt 6 ]; then
            echo "Expected six Mercury Dex sprite atlases, found $COUNT."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
