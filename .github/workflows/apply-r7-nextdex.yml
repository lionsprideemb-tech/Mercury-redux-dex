name: Apply R7 NextDex Review Pass

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_r7_nextdex.py'
      - 'data/pokedex/review_overlay_r7.json.gz.b64'
      - '.github/workflows/apply-r7-nextdex.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-r7-nextdex
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and audit R7 NextDex pass
        run: python3 tools/apply_r7_nextdex.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Commit R7 NextDex pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mercury Redux NextDex Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html data/pokedex/index.json R7_REVIEW_NOTES.md
          if git diff --cached --quiet; then
            echo 'R7 NextDex pass already applied.'
            exit 0
          fi
          git commit -m 'Apply R7 complete NextDex review pass'
          git push
