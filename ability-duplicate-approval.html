<style>

.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--navy),var(--navy2));color:white;border-bottom:3px solid var(--gold);padding:12px 14px 10px;box-shadow:0 3px 14px rgba(0,0,0,.2)}

<header class="top">

</main>

const STORE_KEY="mercury-redux-duplicate-ability-approvals-v1";
const state={index:0,filter:"pending",search:"",approvals:load()};
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"{}")}catch{return {}}}
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(state.approvals));updateProgress()}
function approvalFor(f){return state.approvals[f.id]||{action:"pending",target:"",value:"",notes:""}}
function isReviewed(f){return approvalFor(f).action!=="pending"}
function filtered(){
  const q=state.search.trim().toLowerCase();
  let arr=FAMILIES.filter(f=>{
    if(state.filter==="same-name"&&f.type!=="same-name")return false;
    if(state.filter==="same-mechanic"&&f.type!=="same-mechanic")return false;
    if(state.filter==="reviewed"&&!isReviewed(f))return false;
    if(q){const hay=[f.group,...f.versions.flatMap(v=>[v.name,v.source,v.effect])].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  if(state.filter==="pending") arr.sort((a,b)=>(isReviewed(a)?1:0)-(isReviewed(b)?1:0)||a.reviewIndex-b.reviewIndex);
  return arr;
}
function currentFamily(){const arr=filtered(); if(!arr.length)return null; state.index=Math.max(0,Math.min(state.index,arr.length-1)); return arr[state.index]}
function actionLabel(a){return({pending:"Pending","keep-both":"Keep both as-is","keep-one":"Keep one / remove duplicate","change-name":"Change name","change-effect":"Change effect","merge":"Merge / standardize","research":"Needs research"})[a]||a}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function versionChoices(f,a){
  return '<div class="optionList">'+f.versions.map((v,i)=>'<label class="choice"><input type="radio" name="target" value="'+i+'" '+(String(a.target)===String(i)?"checked":"")+'><span><b>'+esc(v.name)+'</b> — '+esc(v.source)+'</span></label>').join("")+'</div>'
}
function render(){
  const arr=filtered(), f=currentFamily(), mount=document.getElementById("mount");
  if(!f){mount.innerHTML='<div class="empty">No duplicate families match this filter.</div>';updateProgress();return}
  const a=approvalFor(f);
  const versions=f.versions.map((v,i)=>'<article class="version"><div class="vtop"><div class="vname">'+esc(v.name)+'</div><span class="source">'+esc(v.source)+'</span></div><div class="effect">'+esc(v.effect||"(effect description missing)")+'</div><div class="master">Master library row '+esc(v.masterRow)+'</div></article>').join("");
  const hint=f.type==="same-name"?"Same name conflict: if the effects are meaningfully different, Change name or Change effect is usually better than deleting one.":"Different names, same/similar mechanic: keep both if the names serve different identities, or merge/change one if the overlap is unnecessary.";
  mount.innerHTML='<section class="card"><div class="cardHead"><div class="eyebrow">Family '+f.reviewIndex+' of '+FAMILIES.length+' • '+(f.type==="same-name"?"Same name":"Same mechanic")+'</div><div class="familyTitle">'+esc(f.group)+'</div><div class="hint">'+esc(hint)+'</div></div><div class="versions '+(f.versions.length===3?"three":"")+'">'+versions+'</div><div class="approval"><span class="label">Decision</span><div class="actions">'+
    [["keep-both","Keep both"],["keep-one","Keep one"],["change-name","Change name"],["change-effect","Change effect"],["merge","Merge"],["research","Needs research"]].map(([k,l])=>'<button class="action '+(a.action===k?"active":"")+'" data-action="'+k+'">'+l+'</button>').join("")+
    '</div><div id="details" class="details '+(a.action!=="pending"?"show":"")+'"></div><label class="label" style="margin-top:12px">Notes</label><textarea class="field textarea" id="notes" placeholder="Optional notes…">'+esc(a.notes||"")+'</textarea></div></section><div class="nav"><button id="prevBtn">← Previous</button><button class="primary" id="nextBtn">Next →</button></div><div class="statusline">'+(state.index+1)+' of '+arr.length+' in this view • '+esc(actionLabel(a.action))+'</div>';
  wire(f,a);
  renderDetails(f,a);
  updateProgress();
}
function renderDetails(f,a){
  const d=document.getElementById("details"); if(!d)return;
  if(a.action==="pending"||a.action==="keep-both"||a.action==="research"){d.innerHTML=a.action==="research"?'<label class="label">What needs checking?</label><input class="field" id="valueField" value="'+esc(a.value||"")+'" placeholder="Exact mechanic, source, interaction…">':""; return}
  let title="",placeholder="";
  if(a.action==="keep-one"){title="Which version should survive?";placeholder="Optional preferred final name"}
  if(a.action==="change-name"){title="Which version gets renamed?";placeholder="Enter the new ability name"}
  if(a.action==="change-effect"){title="Which version gets a changed effect?";placeholder="Enter the revised effect"}
  if(a.action==="merge"){title="Choose the version to use as the base";placeholder="Final standardized name/effect"}
  d.innerHTML='<label class="label">'+title+'</label>'+versionChoices(f,a)+'<input class="field" id="valueField" value="'+esc(a.value||"")+'" placeholder="'+placeholder+'">';
  d.querySelectorAll('input[name="target"]').forEach(el=>el.addEventListener("change",()=>{a.target=el.value;saveFamily(f,a)}));
}
function saveFamily(f,a){state.approvals[f.id]=a;persist()}
function wire(f,a){
  document.querySelectorAll(".action").forEach(btn=>btn.onclick=()=>{a.action=btn.dataset.action;if(a.action==="keep-both"){a.target="";a.value=""}saveFamily(f,a);render()});
  const n=document.getElementById("notes"); if(n)n.oninput=()=>{a.notes=n.value;saveFamily(f,a)};
  const d=document.getElementById("details"); if(d)d.addEventListener("input",e=>{if(e.target.id==="valueField"){a.value=e.target.value;saveFamily(f,a)}});
  document.getElementById("prevBtn").onclick=()=>{state.index=Math.max(0,state.index-1);render();scrollTo(0,0)};
  document.getElementById("nextBtn").onclick=()=>{const arr=filtered();state.index=Math.min(arr.length-1,state.index+1);render();scrollTo(0,0)};
}
function updateProgress(){const done=FAMILIES.filter(isReviewed).length;document.getElementById("progressCount").textContent=done+" / "+FAMILIES.length;document.getElementById("progressBar").style.width=(FAMILIES.length?done/FAMILIES.length*100:0)+"%"}
function gotoPending(dir=1){
  const arr=filtered(); if(!arr.length)return;
  let i=state.index;
  for(let step=0;step<arr.length;step++){i=(i+dir+arr.length)%arr.length;if(!isReviewed(arr[i])){state.index=i;render();scrollTo(0,0);return}}
}
document.getElementById("search").oninput=e=>{state.search=e.target.value;state.index=0;render()};
document.getElementById("filter").onchange=e=>{state.filter=e.target.value;state.index=0;render()};
document.getElementById("jumpPending").onclick=()=>gotoPending(1);
document.getElementById("nextPending").onclick=()=>gotoPending(1);
document.getElementById("prevPending").onclick=()=>gotoPending(-1);
document.getElementById("firstBtn").onclick=()=>{state.index=0;render();scrollTo(0,0)};
document.getElementById("lastBtn").onclick=()=>{state.index=Math.max(0,filtered().length-1);render();scrollTo(0,0)};
document.getElementById("exportBtn").onclick=()=>{
  const payload={project:"Pokemon Mercury Redux",kind:"duplicate-ability-approval",version:1,exportedAt:new Date().toISOString(),families:FAMILIES,approvals:state.approvals};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="mercury-duplicate-ability-approvals.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const file=e.target.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);state.approvals=j.approvals||j;persist();render();alert("Approvals imported.")}catch{alert("That file was not valid approval JSON.")}};fr.readAsText(file)};
document.getElementById("copyBtn").onclick=async()=>{
  const lines=FAMILIES.filter(isReviewed).map(f=>{const a=approvalFor(f);return "Family "+f.reviewIndex+" — "+f.group+": "+actionLabel(a.action)+(a.target!==""?" | target "+(Number(a.target)+1):"")+(a.value?" | "+a.value:"")+(a.notes?" | "+a.notes:"")});
  try{await navigator.clipboard.writeText(lines.join("\n"));alert("Approval summary copied.")}catch{alert("Clipboard access was blocked by this browser.")}
};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Clear all saved duplicate-ability decisions in this browser?")){state.approvals={};persist();render()}};
render();
</script>
